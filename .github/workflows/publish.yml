name: Publish SDK packages

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  verify-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          test "$GITHUB_REF_NAME" = "v$version"
          test "$(node -p "require('./node/package.json').version")" = "$version"
          test "$(python -c "import tomllib; print(tomllib.load(open('python/pyproject.toml', 'rb'))['project']['version'])")" = "$version"
          echo "value=$version" >> "$GITHUB_OUTPUT"
  github-release:
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - run: go test ./...
      - run: gh release create "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
  npm:
    needs: verify-version
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci --prefix node --registry=https://registry.npmmirror.com
      - run: npm test --prefix node
      - run: npm publish --prefix node --access public --provenance --registry=https://registry.npmjs.org
  pypi:
    needs: verify-version
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/rokid-pluginbridge-plugin-sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade build -i https://mirrors.aliyun.com/pypi/simple
      - run: python -m build python
      - uses: pypa/gh-action-pypi-publish@release/v1
